<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Лекарства">
<meta name="theme-color" content="#0a0f1e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<title>Лекарства по часам</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap">
<style>
/* Ночной режим по умолчанию: тёмно-синий фон, у каждого лекарства свой цвет-свечение, прогресс в виде капсулы. */
:root{
  --bg:#0a0f1e; --bg2:#0f1629; --surface:#121a2f; --surface2:#19233d; --ink:#edf2ff; --muted:#8e9bba; --faint:#5d6a8a; --line:#222d4a;
  --accent:#7ce7c4; --accent-ink:#06241b; --ok:#5ff0b0; --warn:#ffc54d; --bad:#ff7a6b;
  --m1:#ff7a59; --m2:#ffbf3c; --m3:#4cc3ff; --m4:#b18cff; --m5:#ff6fb1; --m6:#3ee0b0;
  --btn-ink:#0a0f1e; --glow:.22; --shadow:0 10px 30px rgba(0,0,0,.35);
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",-apple-system,system-ui,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#eef1f8; --bg2:#e6eaf4; --surface:#ffffff; --surface2:#f3f5fb; --ink:#111830; --muted:#5a6583; --faint:#8a94ad; --line:#dde2ee;
  --accent:#0f8a69; --accent-ink:#ffffff; --ok:#108a55; --warn:#a66a00; --bad:#d2463a;
  --m1:#e2552f; --m2:#c88400; --m3:#1d8fd6; --m4:#7a52d9; --m5:#d23f87; --m6:#119b78;
  --btn-ink:#ffffff; --glow:.10; --shadow:0 6px 24px rgba(30,45,90,.08);
  color-scheme:light}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(120% 60% at 50% -10%,var(--bg2),var(--bg) 70%);background-attachment:fixed;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}
[hidden]{display:none!important}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.bigclock{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em}
.bigclock .colon{opacity:.35}
.iconbtn{width:46px;height:46px;border-radius:15px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px;stroke:var(--ink)}

/* now panel */
.now{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.tile .v{font-weight:700;font-size:15px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;box-shadow:0 0 8px var(--c)}

/* medicine card */
.cards{display:grid;gap:12px}
.card{--c:var(--m6);position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:grid;gap:14px;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;inset:-40% -20% auto auto;width:70%;height:120%;background:radial-gradient(closest-side,var(--c),transparent);opacity:var(--glow);pointer-events:none}
.card.ready{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.top{display:flex;gap:12px;align-items:center;position:relative;min-width:0}
.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.ico svg{width:24px;height:24px;stroke:currentColor}
.title{min-width:0;flex:1}
.name{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{flex:none;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.badge.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.badge.wait{background:var(--surface2);color:var(--muted)}
.badge.limit{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.badge.never{background:var(--surface2);color:var(--muted)}

.timer{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.elapsed{font-family:var(--f-body);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.elapsed small{font-size:.5em;font-weight:700;color:var(--muted);letter-spacing:0;margin-left:2px}
.timer .lbl{font-size:13px;color:var(--muted)}
.timer.none .elapsed{font-size:22px;color:var(--muted);font-weight:700}

/* capsule progress */
.capsule{position:relative;height:22px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.capsule .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,transparent),var(--c));transition:width .8s ease}
.capsule .half{position:absolute;inset:0 0 0 50%;border-left:1px dashed color-mix(in srgb,var(--ink) 18%,transparent)}
.card.ready .capsule .fill{box-shadow:0 0 18px var(--c)}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:6px}
.ends b{color:var(--ink);font-weight:700}

.actions{display:flex;gap:8px;position:relative}
.give{flex:1;height:52px;border-radius:16px;font-weight:800;font-size:16px;color:var(--btn-ink);background:var(--c);box-shadow:0 6px 18px color-mix(in srgb,var(--c) 35%,transparent);transition:transform .1s}
.give:active{transform:scale(.97)}
.alt{height:52px;padding:0 16px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink)}

/* temperature */
.temp,.panel,.card,.cards{grid-template-columns:minmax(0,1fr)}
.temp{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:grid;gap:12px;box-shadow:var(--shadow)}
.temphead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tempval{font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.tempval small{font-size:.5em;color:var(--muted);font-weight:700}
.spark{width:100%;height:56px}
.tempform{display:flex;gap:8px}
.tempform input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-weight:700;font-size:17px;padding:0 14px}
.tempform button{height:48px;padding:0 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800}
.qt{display:flex;gap:6px;flex-wrap:wrap}
.qt{align-items:center}
.qt .ql{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.qt button{padding:8px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--muted)}
.qt button.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--ink)}
.tcustom{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:16px;padding:0 12px;width:100%;min-width:0}
.tprev{font-size:13px;color:var(--muted);min-height:20px}
.tprev b{font-weight:800}

/* 24h strip */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;display:grid;gap:10px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0}
.ph span{font-size:12px;color:var(--muted)}
.strip{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center}
.srow .nm{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:22px;border-radius:8px;background:var(--surface2);margin:0 6px}
.track .g{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.track .d{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--c);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--surface2),0 0 10px var(--c)}
.axis{display:grid;grid-template-columns:104px 1fr;gap:10px}
.axis .ticks{position:relative;height:16px;margin:0 6px}
.axis .ticks span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

/* log */
.log{display:grid;gap:14px}
.day{display:grid}
.dayname{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted);padding:0 2px 8px}
.entry{display:grid;grid-template-columns:50px 22px 1fr auto;gap:8px;align-items:center;padding:9px 0;position:relative}
.entry .t{font-weight:700;font-variant-numeric:tabular-nums}
.entry .rail{position:relative;height:100%;display:grid;place-items:center}
.entry .rail::before{content:"";position:absolute;top:-9px;bottom:-9px;left:50%;width:2px;background:var(--line);transform:translateX(-50%)}
.day .entry:first-of-type .rail::before{top:50%}
.day .entry:last-child .rail::before{bottom:50%}
.day .entry:only-of-type .rail::before{display:none}
.entry .dot{position:relative;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--surface)}
.entry .what{min-width:0;font-weight:600}
.entry .what small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.del{font-size:12.5px;font-weight:700;color:var(--faint);padding:8px 10px;border-radius:10px}
.del.armed{background:var(--bad);color:#fff}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}

.altcard{position:relative;overflow:hidden;background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:24px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;box-shadow:var(--shadow)}
.altcard::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,color-mix(in srgb,var(--m1) 18%,transparent),transparent 45%,color-mix(in srgb,var(--m2) 18%,transparent));pointer-events:none}
.altcard>*{position:relative}
.seq{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seq .st{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:700}
.seq .st i{width:9px;height:9px;border-radius:50%;background:var(--sc);display:inline-block}
.seq .st.prev{opacity:.7;font-weight:600}
.seq .st.next{background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset 0 0 0 1.5px var(--c)}
.seq .arr{color:var(--muted);font-weight:700}
.nextname{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.15;color:var(--c);overflow-wrap:anywhere}
.why{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center}
.tog{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;min-height:36px}
.tog input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.foot{color:var(--faint);font-size:12px;text-align:center;line-height:1.5}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(3,6,15,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:90vh;overflow:auto;animation:up .25s ease}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0}
.field{display:grid;gap:6px}
.field span{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.medcard input{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:16px;padding:0 12px;width:100%;min-width:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{padding:9px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.row{display:flex;gap:8px}
.primary{flex:1;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:800}
.secondary{height:52px;padding:0 18px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);font-weight:600}
.medcard{border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;background:var(--bg2)}
.medcard .r1{display:flex;gap:8px;align-items:center}
.medcard .sw{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.medcard .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.medcard label span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.medcard .x{width:44px;height:48px;border-radius:12px;color:var(--faint);font-size:18px;flex:none}
.note{font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:14px;padding:10px 12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 12px 12px 18px;display:flex;gap:12px;align-items:center;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.35);width:max-content;max-width:calc(100% - 32px);font-weight:600;animation:up .25s ease}
.toast button{color:var(--bg);background:color-mix(in srgb,var(--bg) 14%,transparent);font-weight:800;padding:6px 10px;border-radius:10px}
@keyframes up{from{transform:translateY(20px);opacity:0}}
.toast{animation-name:tup}@keyframes tup{from{transform:translate(-50%,20px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media (max-width:370px){.bigclock{font-size:34px}.elapsed{font-size:32px}.srow,.axis{grid-template-columns:84px 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="eyebrow" id="dateLine">Лекарства по часам</div>
      <div class="bigclock num" id="clock">--:--</div>
    </div>
    <button class="iconbtn" id="openSettings" aria-label="Настроить лекарства">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    </button>
  </header>

  <section class="altcard" id="alt" hidden></section>
  <section class="now" id="now"></section>
  <section class="cards" id="cards"></section>

  <section class="temp" id="tempCard">
    <div class="temphead">
      <div><div class="eyebrow">Температура</div><div class="tempval num" id="tempVal">—</div><div class="meta" id="tempAgo">ещё не записывали</div></div>
      <div class="ico" style="--c:var(--bad)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/><path d="M12 11v6"/></svg></div>
    </div>
    <svg class="spark" id="spark" viewBox="0 0 300 56" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="tempform">
      <input id="tempInput" class="num" inputmode="decimal" autocomplete="off" placeholder="Например, 381" aria-label="Температура, °C">
      <button id="tempSave">Записать</button>
    </div>
    <div class="tprev num" id="tempPrev"></div>
    <div class="qt" id="tempWhen"><span class="ql">Когда</span><button data-tw="0" class="on">Сейчас</button><button data-tw="15">15 мин назад</button><button data-tw="30">30 мин</button><button data-tw="60">1 ч</button><button data-tw="custom">Другое время</button></div>
    <input type="datetime-local" id="tempCustom" class="tcustom" aria-label="Время измерения" hidden>
  </section>

  <section class="panel">
    <div class="ph"><h2>Последние 24 часа</h2><span>каждая точка — приём</span></div>
    <div class="strip" id="strip"></div>
  </section>

  <section class="panel">
    <div class="ph"><h2>Журнал</h2><span id="logCount"></span></div>
    <div class="log" id="log"></div>
  </section>

  <p class="foot">Записи хранятся только на этом телефоне, в этом браузере.<br>Интервалы и дозировки — по назначению врача и инструкции; их можно поменять в настройках.</p>
</div>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
const DEFAULT_MEDS=[
  {id:"cefekon",name:"Цефекон Д",form:"свечи · жаропонижающее",hours:6,max:3,color:"m1",fever:true},
  {id:"nurofen",name:"Нурофен",form:"сироп · жаропонижающее",hours:6,max:3,color:"m2",fever:true},
  {id:"miramistin",name:"Мирамистин",form:"спрей",hours:4,max:4,color:"m3",fever:false},
  {id:"genferon",name:"Генферон Лайт",form:"свечи",hours:12,max:2,color:"m4",fever:false}
];
const COLORS=["m1","m2","m3","m4","m5","m6"];
const ICONS={
  supp:'<path d="M12 3c3 0 5 3.2 5 7.5V19a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-8.5C7 6.2 9 3 12 3z"/><path d="M7 15h10"/>',
  bottle:'<path d="M9.5 2.5h5v3h-5z"/><path d="M8.5 5.5h7l1.5 3V20a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 20V8.5z"/><path d="M7 12h10v5H7"/>',
  spray:'<path d="M9 10h6v10a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 20z"/><path d="M10.5 10V6.5h3V10"/><path d="M10.5 6.5V4h3.5l1.5 1"/><path d="M18.5 3.5v.01M20 6v.01M18.5 8.5v.01"/>',
  pill:'<path d="M4.6 13.4l8.8-8.8a4.2 4.2 0 0 1 6 6l-8.8 8.8a4.2 4.2 0 0 1-6-6z"/><path d="M9 9l6 6"/>'
};
function iconFor(m){const f=(m.form||"")+" "+m.name;return /свеч/i.test(f)?"supp":/сироп|суспенз/i.test(f)?"bottle":/спрей|аэроз/i.test(f)?"spray":"pill"}

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let meds=LS.get("meds",DEFAULT_MEDS), doses=LS.get("doses",[]), pending={}, alt=LS.get("alt",{on:true,gap:4});
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function addDose(d){d.id=d.id||uid();doses.push(d);LS.set("doses",doses);render();return d.id}
function removeDose(id){doses=doses.filter(x=>x.id!==id);LS.set("doses",doses);render()}
function saveMeds(list){meds=list;LS.set("meds",list);render()}

const H=3600e3,M=60e3;
const p2=n=>String(n).padStart(2,"0");
function dur(ms){ms=Math.max(0,ms);const h=Math.floor(ms/H),m=Math.floor((ms%H)/M);
  if(h>=48)return Math.floor(h/24)+" дн";if(h===0)return m<1?"меньше минуты":m+" мин";return h+" ч"+(m?" "+m+" мин":"")}
function clockDur(ms){ms=Math.max(0,ms);const h=Math.floor(ms/H),m=Math.floor((ms%H)/M),s=Math.floor((ms%M)/1000);
  if(h>=72)return Math.floor(h/24)+"<small>дн</small>";
  return (h?h+"<small>ч</small> ":"")+p2(m)+"<small>м</small> "+p2(s)+"<small>с</small>"}
function hm(t){const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes())}
function dayKey(t){const d=new Date(t);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
function dayName(t){const now=new Date(),d=new Date(t),k=dayKey(t);if(k===dayKey(now))return"Сегодня";
  const y=new Date(now);y.setDate(y.getDate()-1);if(k===dayKey(y))return"Вчера";return d.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function medById(id){return meds.find(m=>m.id===id)}
function lastOf(id){let b=null;for(const d of doses)if(d.med===id&&(!b||d.at>b.at))b=d;return b}
function last24(id){const c=Date.now()-24*H;return doses.filter(d=>d.med===id&&d.at>c).length}

function feverMeds(){return meds.filter(m=>m.fever)}
function altActive(){return alt.on&&feverMeds().length>=2}
function lastFever(exceptId){let b=null;for(const d of doses){const m=medById(d.med);if(m&&m.fever&&d.med!==exceptId&&(!b||d.at>b.at))b=d}return b}
function feverTurn(){const fm=feverMeds(),l=lastFever();if(!l)return null;const i=fm.findIndex(m=>m.id===l.med);return fm[(i+1)%fm.length]}
function stateOf(m,now){
  const last=lastOf(m.id),iv=(+m.hours||0)*H,n=last24(m.id);
  let at=last&&iv?last.at+iv:0,from=last?last.at:0,why="";
  if(m.fever&&altActive()&&alt.gap){const o=lastFever(m.id);if(o){const t=o.at+alt.gap*H;if(t>at){at=t;from=o.at;why="пауза между жаропонижающими — "+String(alt.gap).replace(".",",")+" ч"}}}
  const el=last?now-last.at:0,base={last,iv,n,el,at,from,why};
  if(at>now)return Object.assign(base,{k:"wait",left:at-now});
  if(m.max&&n>=m.max&&last)return Object.assign(base,{k:"limit"});
  if(m.fever&&altActive()){const t=feverTurn();if(t&&t.id!==m.id)return Object.assign(base,{k:"notturn",turn:t})}
  return Object.assign(base,{k:last?"ok":"never"});
}
function sig(){const now=Date.now();return meds.map(m=>stateOf(m,now).k).join()+"|"+new Date(now).getMinutes()}
let lastSig="";

function render(){
  const now=Date.now();lastSig=sig();
  document.getElementById("dateLine").textContent=new Date(now).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});

  // cards
  document.getElementById("cards").innerHTML=meds.map(m=>{
    const s=stateOf(m,now),ic=ICONS[iconFor(m)];
    const badge={never:'<span class="badge never">Не давали</span>',ok:'<span class="badge ok">Можно давать</span>',
      wait:'<span class="badge wait num">через '+(s.left?dur(s.left):"")+'</span>',limit:'<span class="badge limit">Лимит '+s.n+'/'+m.max+'</span>',
      notturn:'<span class="badge wait">⇄ очередь: '+(s.turn?esc(s.turn.name):"")+'</span>'}[s.k];
    const meta=[esc(m.form||""),m.hours?"каждые "+String(m.hours).replace(".",",")+" ч":"",m.max?s.n+" из "+m.max+" за 24 ч":""].filter(Boolean).join(" · ");
    let timer,cap="";
    const whyH=s.why&&s.k==="wait"?`<div class="why">⇄ ${esc(s.why)}</div>`:"";
    if(!s.last){timer='<div class="timer none"><span class="elapsed">Ещё не давали</span>'+badge+'</div>'+(s.k==="wait"?`<div><div class="capsule"><div class="fill" style="width:${Math.min(100,(now-s.from)/(s.at-s.from)*100)}%"></div></div><div class="ends num"><span></span><span>можно в <b>${hm(s.at)}</b></span></div>${whyH}</div>`:"")}
    else{
      const pct=s.k==="wait"?Math.min(100,(now-s.from)/(s.at-s.from)*100):100;
      timer=`<div><div class="eyebrow" style="margin-bottom:6px">Прошло с приёма</div><div class="timer"><span class="elapsed" data-since="${s.last.at}">${clockDur(now-s.last.at)}</span>${badge}</div></div>`;
      cap=`<div><div class="capsule"><div class="fill" style="width:${pct}%"></div><div class="half"></div></div>
        <div class="ends num"><span>дали <b>${hm(s.last.at)}</b>${dayKey(s.last.at)!==dayKey(now)?" "+dayName(s.last.at).toLowerCase():""}</span>
        <span>${s.k==="wait"?"можно в <b>"+hm(s.at)+"</b>":s.k==="notturn"?"сейчас очередь <b>"+esc(s.turn.name)+"</b>":s.iv||s.why?"можно <b>сейчас</b>":"интервал не задан"}</span></div>${whyH}</div>`;
    }
    return `<article class="card${s.k==="ok"||s.k==="never"?" ready":""}" style="--c:var(--${m.color||"m6"})">
      <div class="top"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></div>
        <div class="title"><div class="name">${esc(m.name)}</div><div class="meta">${meta}</div></div></div>
      ${timer}${cap}
      <div class="actions"><button class="give" data-give="${esc(m.id)}">Дал сейчас</button><button class="alt" data-alt="${esc(m.id)}">Другое время</button></div>
    </article>`;
  }).join("");

  // now panel
  const fever=doses.filter(d=>{const m=medById(d.med);return m&&m.fever}).sort((a,b)=>b.at-a.at)[0];
  const can=[],wait=[];
  for(const m of meds){const s=stateOf(m,now);if(s.k==="ok"||s.k==="never")can.push(m);else if(s.k==="wait")wait.push({m,s})}
  wait.sort((a,b)=>a.s.at-b.s.at);
  const chip=m=>`<span class="chip" style="--c:var(--${m.color||"m6"})"><i></i>${esc(m.name)}</span>`;
  // alternation card
  const altEl=document.getElementById("alt");
  if(altActive()){
    const fm=feverMeds(),lf=lastFever(),nx=feverTurn()||fm[0],ns=stateOf(nx,now),lm=lf&&medById(lf.med);
    const col=m=>"var(--"+(m.color||"m6")+")";
    const pct=ns.k==="wait"?Math.min(100,(now-ns.from)/(ns.at-ns.from)*100):100;
    altEl.hidden=false;altEl.style.setProperty("--c",col(nx));
    altEl.innerHTML=`<div class="eyebrow">Жаропонижающие по очереди</div>
      <div class="seq">${lm?`<span class="st prev" style="--sc:${col(lm)}"><i></i>${esc(lm.name)} · ${hm(lf.at)}</span><span class="arr">→</span>`:""}<span class="st next" style="--sc:${col(nx)}"><i></i>${esc(nx.name)}</span></div>
      <div><div class="eyebrow" style="margin-bottom:4px">${lf?"Следующим даём":"Начните с любого"}</div><div class="nextname">${esc(nx.name)}</div>
      <div class="meta num">${ns.k==="wait"?"можно в <b>"+hm(ns.at)+"</b> · через "+dur(ns.left):ns.k==="limit"?"уже "+ns.n+" раз за сутки":"можно давать сейчас"}${lf?" · с прошлого жаропонижающего "+dur(now-lf.at):""}</div></div>
      ${lf?`<div><div class="capsule"><div class="fill" style="width:${pct}%"></div><div class="half"></div></div>${ns.why&&ns.k==="wait"?`<div class="why">⇄ ${esc(ns.why)}</div>`:""}</div>`:""}
      <div class="actions"><button class="give" style="--c:${col(nx)}" data-give="${esc(nx.id)}">Дал ${esc(nx.name)}</button></div>`;
  }else{altEl.hidden=true;altEl.innerHTML=""}

  document.getElementById("now").innerHTML=(altActive()?"":
    `<div class="tile"><span class="k">Жаропонижающее</span><span class="v">${fever?esc(medById(fever.med).name):"не давали"}</span><span class="s num">${fever?dur(now-fever.at)+" назад":"—"}</span></div>`)+
    `<div class="tile${altActive()?" wide":""}"><span class="k">Следующее</span><span class="v">${wait[0]?esc(wait[0].m.name):"—"}</span><span class="s num">${wait[0]?"в "+hm(wait[0].s.at)+" · через "+dur(wait[0].s.left):"никого не ждём"}</span></div>
     <div class="tile wide"><span class="k">Можно дать сейчас</span>${can.length?`<div class="chips">${can.map(chip).join("")}</div>`:'<span class="s">Пока ничего — смотрите время на карточках</span>'}</div>`;

  // temperature
  const temps=doses.filter(d=>d.med==="temp").sort((a,b)=>a.at-b.at);
  const lt=temps[temps.length-1];
  const tcol=v=>v>=38?"var(--bad)":v>=37.3?"var(--warn)":"var(--ok)";
  document.getElementById("tempVal").innerHTML=lt?`<span style="color:${tcol(+lt.value)}">${String(lt.value).replace(".",",")}</span><small> °C</small>`:"—";
  document.getElementById("tempAgo").textContent=lt?"в "+hm(lt.at)+" · "+dur(now-lt.at)+" назад":"ещё не записывали";
  const sp=temps.filter(t=>t.at>now-48*H),svg=document.getElementById("spark");
  if(sp.length){
    const t0=now-48*H,X=t=>(t-t0)/(48*H)*292+4,Y=v=>52-(Math.min(41,Math.max(35.5,v))-35.5)/5.5*48;
    const pts=sp.map(t=>X(t.at).toFixed(1)+","+Y(+t.value).toFixed(1)).join(" ");
    svg.innerHTML=`<line x1="0" x2="300" y1="${Y(38)}" y2="${Y(38)}" stroke="var(--bad)" stroke-opacity=".35" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      <text x="2" y="${Y(38)-3}" fill="var(--faint)" font-size="9">38°</text>
      ${sp.length>1?`<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`:""}
      ${sp.map(t=>`<circle cx="${X(t.at)}" cy="${Y(+t.value)}" r="3.2" fill="${tcol(+t.value)}"/>`).join("")}`;
  }else svg.innerHTML=`<text x="150" y="32" text-anchor="middle" fill="var(--faint)" font-size="11">здесь появится график за 48 часов</text>`;

  // 24h strip
  const start=now-24*H,P=t=>((t-start)/(24*H)*100).toFixed(2)+"%";
  const ticks=[];{const d=new Date(start);d.setMinutes(0,0,0);d.setHours(d.getHours()+1);while(d.getTime()<now){if(d.getHours()%6===0)ticks.push(d.getTime());d.setHours(d.getHours()+1)}}
  const grid=ticks.map(t=>`<span class="g" style="left:${P(t)}"></span>`).join("");
  document.getElementById("strip").innerHTML=meds.map(m=>{
    const ds=doses.filter(d=>d.med===m.id&&d.at>start);
    return `<div class="srow"><span class="nm">${esc(m.name)}</span><div class="track" style="--c:var(--${m.color||"m6"})">${grid}${ds.map(d=>`<span class="d" style="left:${P(d.at)}"></span>`).join("")}</div></div>`;
  }).join("")+`<div class="axis"><span></span><div class="ticks">${ticks.map(t=>`<span style="left:${P(t)}">${hm(t)}</span>`).join("")}</div></div>`;

  // log
  const sorted=doses.slice().sort((a,b)=>b.at-a.at).slice(0,200);
  document.getElementById("logCount").textContent=sorted.length?"записей: "+doses.length:"";
  if(!sorted.length){document.getElementById("log").innerHTML='<div class="empty">Здесь будет история: время, лекарство и сколько прошло с прошлого раза.</div>';return}
  const groups=[];let cur=null;
  for(const d of sorted){const k=dayKey(d.at);if(!cur||cur.k!==k){cur={k,name:dayName(d.at),items:[]};groups.push(cur)}cur.items.push(d)}
  document.getElementById("log").innerHTML=groups.map(g=>`<div class="day"><div class="dayname">${g.name}</div>${g.items.map(d=>{
    let name,c,sub="";
    if(d.med==="temp"){name="Температура "+esc(String(d.value).replace(".",","))+" °C";c=tcol(+d.value)}
    else{const m=medById(d.med);name=m?esc(m.name):"Удалённое лекарство";c="var(--"+(m&&m.color||"m6")+")";
      const prev=doses.filter(x=>x.med===d.med&&x.at<d.at).sort((a,b)=>b.at-a.at)[0];
      if(prev)sub="через "+dur(d.at-prev.at)+" после прошлого";}
    if(d.note)sub=(sub?sub+" · ":"")+esc(d.note);
    return `<div class="entry"><span class="t">${hm(d.at)}</span><span class="rail"><span class="dot" style="--c:${c}"></span></span><span class="what">${name}${sub?"<small>"+sub+"</small>":""}</span><button class="del${pending[d.id]?" armed":""}" data-del="${esc(d.id)}" aria-label="Удалить запись">${pending[d.id]?"Удалить":"✕"}</button></div>`;
  }).join("")}</div>`).join("");
}

function tick(){
  const now=Date.now(),d=new Date(now);
  document.getElementById("clock").innerHTML=p2(d.getHours())+'<span class="colon">:</span>'+p2(d.getMinutes());
  if(document.getElementById("sheetHost").firstChild)return;
  if(sig()!==lastSig){render();return}
  document.querySelectorAll("[data-since]").forEach(el=>el.innerHTML=clockDur(now-(+el.dataset.since)));
  if(d.getSeconds()===0)updTempPrev();
}

let toastTimer;
function toast(text,undo){
  const host=document.getElementById("toastHost");
  host.innerHTML=`<div class="toast" role="status"><span>${esc(text)}</span>${undo?'<button id="undoBtn">Отменить</button>':""}</div>`;
  if(undo)document.getElementById("undoBtn").onclick=()=>{undo();host.innerHTML=""};
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>host.innerHTML="",5000);
}

function closeSheet(){document.getElementById("sheetHost").innerHTML="";render()}
function openSheet(html,onReady){
  const host=document.getElementById("sheetHost");
  host.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  document.getElementById("scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
  onReady&&onReady();
}
function toLocalInput(t){const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}

function openTimeSheet(id){
  const m=medById(id);
  openSheet(`<h3>${esc(m.name)}: когда дали?</h3>
    <div class="quick"><button data-ago="15">15 мин назад</button><button data-ago="30">30 мин</button><button data-ago="60">1 ч</button><button data-ago="120">2 ч</button><button data-ago="180">3 ч</button></div>
    <label class="field"><span>Дата и время</span><input type="datetime-local" id="whenInput"></label>
    <label class="field"><span>Заметка (необязательно)</span><input id="noteInput" placeholder="например, 5 мл или половина свечи"></label>
    <div class="row"><button class="secondary" id="cancelT">Отмена</button><button class="primary" id="saveT">Записать</button></div>`,()=>{
    const w=document.getElementById("whenInput");w.value=toLocalInput(Date.now());
    document.querySelectorAll("[data-ago]").forEach(b=>b.onclick=()=>w.value=toLocalInput(Date.now()-b.dataset.ago*M));
    document.getElementById("cancelT").onclick=closeSheet;
    document.getElementById("saveT").onclick=()=>{
      const at=new Date(w.value).getTime();if(!at)return;
      const note=document.getElementById("noteInput").value.trim();
      document.getElementById("sheetHost").innerHTML="";
      const did=addDose({med:id,at:Math.min(at,Date.now()),note});
      toast(m.name+" — записано на "+hm(at),()=>removeDose(did));
    };
  });
}

function openSettings(){
  let draft=meds.map(m=>Object.assign({},m));
  const draw=()=>{
    openSheet(`<h3>Лекарства</h3>
      ${draft.map((m,i)=>`<div class="medcard" style="--c:var(--${m.color})">
        <div class="r1"><span class="sw"></span><input data-i="${i}" data-k="name" value="${esc(m.name)}" aria-label="Название"><button class="x" data-rm="${i}" aria-label="Убрать">✕</button></div>
        <div class="r2"><label><span>Интервал, часов</span><input data-i="${i}" data-k="hours" class="num" inputmode="decimal" value="${m.hours||""}"></label>
        <label><span>Максимум за сутки</span><input data-i="${i}" data-k="max" class="num" inputmode="numeric" value="${m.max||""}"></label></div>
        <label><span>Форма / заметка</span><input data-i="${i}" data-k="form" value="${esc(m.form||"")}"></label>
        <label class="tog"><input type="checkbox" data-i="${i}" data-k="fever" ${m.fever?"checked":""}> Жаропонижающее</label></div>`).join("")}
      <div class="medcard" style="--c:var(--accent)"><label class="tog"><input type="checkbox" id="altOn" ${alt.on?"checked":""}> Давать жаропонижающие по очереди</label>
        <label><span>Минимум между разными жаропонижающими, часов</span><input id="altGap" class="num" inputmode="decimal" value="${alt.gap||""}"></label></div>
      <button class="secondary" id="addMed">+ Добавить лекарство</button>
      <div class="note">Интервал и максимум приёмов — как сказал врач или как написано в инструкции. Пустое поле — без ограничения. Промежуток между разными жаропонижающими тоже уточните у врача. Слова «свечи», «сироп», «спрей» в форме меняют иконку.</div>
      <div class="row"><button class="secondary" id="cancelS">Отмена</button><button class="primary" id="saveS">Сохранить</button></div>`,()=>{
      document.querySelectorAll(".medcard input[data-i]").forEach(inp=>inp.oninput=inp.onchange=()=>{
        const m=draft[inp.dataset.i],k=inp.dataset.k,v=inp.value;
        m[k]=k==="fever"?inp.checked:(k==="name"||k==="form")?v:(parseFloat(v.replace(",","."))||0);
      });
      document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.rm,1);draw()});
      document.getElementById("addMed").onclick=()=>{draft.push({id:uid(),name:"Новое лекарство",form:"",hours:8,max:0,color:COLORS[draft.length%COLORS.length],fever:false});draw()};
      document.getElementById("cancelS").onclick=closeSheet;
      document.getElementById("saveS").onclick=()=>{alt={on:document.getElementById("altOn").checked,gap:parseFloat(document.getElementById("altGap").value.replace(",","."))||0};LS.set("alt",alt);draft=draft.filter(m=>m.name.trim());document.getElementById("sheetHost").innerHTML="";saveMeds(draft);toast("Сохранено")};
    });
  };
  draw();
}

document.addEventListener("click",e=>{
  const g=e.target.closest("[data-give]");if(g){const m=medById(g.dataset.give);const did=addDose({med:m.id,at:Date.now(),note:""});
    if(navigator.vibrate)try{navigator.vibrate(30)}catch(_){}
    toast(m.name+" — записано в "+hm(Date.now()),()=>removeDose(did));return}
  const a=e.target.closest("[data-alt]");if(a){openTimeSheet(a.dataset.alt);return}
  const d=e.target.closest("[data-del]");if(d){const id=d.dataset.del;
    if(pending[id]){delete pending[id];removeDose(id)}else{pending={};pending[id]=1;render();setTimeout(()=>{if(pending[id]){delete pending[id];render()}},3500)}return}
});
document.getElementById("openSettings").onclick=openSettings;
/* temperature input: 381 -> 38,1 */
let tw="0";
function parseTemp(str){
  const s=String(str).replace(/\s/g,"").replace(".",",");if(!s)return NaN;
  if(s.includes(","))return parseFloat(s.replace(",","."));
  const d=s.replace(/\D/g,"");if(!d)return NaN;
  return d.length<=2?+d:+(d.slice(0,2)+"."+d.slice(2,3));
}
function tempAt(){
  if(tw==="custom"){const t=new Date(document.getElementById("tempCustom").value).getTime();return t?Math.min(t,Date.now()):Date.now()}
  return Date.now()-(+tw)*M;
}
function updTempPrev(){
  const inp=document.getElementById("tempInput"),el=document.getElementById("tempPrev"),v=parseTemp(inp.value);
  const tc=v>=38?"var(--bad)":v>=37.3?"var(--warn)":"var(--ok)";
  if(!inp.value)el.innerHTML="Можно без запятой: наберите 381 — будет 38,1";
  else if(v>=34&&v<=43)el.innerHTML=`Запишется <b style="color:${tc}">${v.toFixed(1).replace(".",",")} °C</b> на <b>${hm(tempAt())}</b>`;
  else el.innerHTML="Похоже на опечатку — нужно от 34 до 43 °C";
}
const tIn=document.getElementById("tempInput");
tIn.addEventListener("input",e=>{
  if(!(e.inputType&&e.inputType.startsWith("delete"))){
    let s=tIn.value.replace(/\./g,",").replace(/[^\d,]/g,"");
    const i=s.indexOf(",");
    if(i>=0)s=s.slice(0,i+1)+s.slice(i+1).replace(/,/g,"").slice(0,1);
    else if(s.length>=3)s=s.slice(0,2)+","+s.slice(2,3);
    tIn.value=s;
  }
  updTempPrev();
});
document.getElementById("tempWhen").addEventListener("click",e=>{
  const b=e.target.closest("[data-tw]");if(!b)return;
  tw=b.dataset.tw;
  document.querySelectorAll("#tempWhen [data-tw]").forEach(x=>x.classList.toggle("on",x===b));
  const c=document.getElementById("tempCustom");
  c.hidden=tw!=="custom";if(tw==="custom"){c.value=toLocalInput(Date.now());c.focus()}
  updTempPrev();
});
document.getElementById("tempCustom").addEventListener("input",updTempPrev);
document.getElementById("tempSave").onclick=()=>{
  const v=parseTemp(tIn.value);
  if(!(v>=34&&v<=43)){tIn.focus();toast("Введите температуру, например 381 или 38,1");return}
  const at=tempAt();
  tIn.value="";tIn.blur();const did=addDose({med:"temp",at,value:v.toFixed(1)});
  tw="0";document.querySelectorAll("#tempWhen [data-tw]").forEach(x=>x.classList.toggle("on",x.dataset.tw==="0"));document.getElementById("tempCustom").hidden=true;
  updTempPrev();
  toast("Температура "+v.toFixed(1).replace(".",",")+" °C — записано на "+hm(at),()=>removeDose(did));
};
updTempPrev();
document.getElementById("tempInput").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("tempSave").click()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
render();tick();setInterval(tick,1000);
</script>
</body></html>
